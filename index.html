<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Store</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '45202529883535');
    fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=45202529883535&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>
<body>
  <header>
    <h1><a href="index.html">Demo Store</a></h1>
    <nav><a href="cart.html" id="cart-link">Cart (<span id="cart-count">0</span>)</a></nav>
  </header>

  <main class="products">
    <div class="product-card" data-id="1" data-name="Classic Sneakers" data-price="89.99" data-category="Footwear" data-img="https://placehold.co/300x300/e2e8f0/1a202c?text=Sneakers">
      <img src="https://placehold.co/300x300/e2e8f0/1a202c?text=Sneakers" alt="Classic Sneakers">
      <h2>Classic Sneakers</h2>
      <p class="price">$89.99</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="2" data-name="Wireless Headphones" data-price="149.99" data-category="Electronics" data-img="https://placehold.co/300x300/e2e8f0/1a202c?text=Headphones">
      <img src="https://placehold.co/300x300/e2e8f0/1a202c?text=Headphones" alt="Wireless Headphones">
      <h2>Wireless Headphones</h2>
      <p class="price">$149.99</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="3" data-name="Leather Backpack" data-price="199.99" data-category="Accessories" data-img="https://placehold.co/300x300/e2e8f0/1a202c?text=Backpack">
      <img src="https://placehold.co/300x300/e2e8f0/1a202c?text=Backpack" alt="Leather Backpack">
      <h2>Leather Backpack</h2>
      <p class="price">$199.99</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // --- Pixel: ViewContent when a product card is clicked ---
    document.querySelectorAll('.product-card').forEach(card => {
      card.addEventListener('click', function(e) {
        if (e.target.classList.contains('add-to-cart')) return; // handled separately
        fbq('track', 'ViewContent', {
          content_name: this.dataset.name,
          content_ids: [this.dataset.id],
          content_type: 'product',
          content_category: this.dataset.category,
          value: parseFloat(this.dataset.price),
          currency: 'USD'
        });
      });
    });
  </script>
</body>
</html>
